<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Mi's Birthday Party</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap">
<style>
/* Layout: one calm column. Big title, a field of balloons to pop, a cake to blow out, three gifts to open. Bold moment: the balloons. */
:root {
  --bg: #EBEEFB;
  --paper: #FFFDF7;
  --ink: #24234B;
  --muted: #5E5D86;
  --line: #D6DAF2;
  --coral: #FF6B5A;
  --gold: #FFC24B;
  --teal: #2DB39E;
  --lilac: #8C86FF;
  --red: #D92D3A;
  --green: #168A4A;
  --sky1: #4DB8FF; --sky2: #C4ECFF; --cloud: #FFFFFF; --stars: 0;
  --g1: #74C844; --g2: #69B93A;
  --wall-filter: brightness(1);
  --title-glow: 0 3px 0 rgba(255,255,255,.85), 0 0 18px rgba(255,255,255,.55);
  --on-accent: #24234B;
  --shadow: rgba(36, 35, 75, .18);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14132B; --paper: #232148; --ink: #EEECFF; --muted: #AAA8D8; --line: #3A386B; --shadow: rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14132B; --paper: #232148; --ink: #EEECFF; --muted: #AAA8D8; --line: #3A386B; --shadow: rgba(0, 0, 0, .45);
  color-scheme: dark;
}

@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --red: #FF5A63; --green: #3DD27F; --sky1: #0B1636; --sky2: #2A4380; --cloud: #8FA2D6; --stars: 1; --g1: #2F5B2D; --g2: #285027; --wall-filter: brightness(.5); --title-glow: 0 3px 0 rgba(0,0,0,.5); } }
:root[data-theme="dark"] { --red: #FF5A63; --green: #3DD27F; --sky1: #0B1636; --sky2: #2A4380; --cloud: #8FA2D6; --stars: 1; --g1: #2F5B2D; --g2: #285027; --wall-filter: brightness(.5); --title-glow: 0 3px 0 rgba(0,0,0,.5); }

* { box-sizing: border-box; }
body {
  background: var(--g2);
  position: relative;
  color: var(--ink);
  font-family: var(--f-display);
  font-size: 17px;
  line-height: 1.5;
  padding-block: 32px 72px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--lilac); outline-offset: 3px; border-radius: 8px; }

.blobs { display: none; position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.blob { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .35; transition: transform .6s cubic-bezier(.2,.7,.3,1); }
.b1 { width: 320px; height: 320px; background: var(--coral); top: -80px; left: -90px; transform: translate(calc(var(--mx, 0) * 30px), calc(var(--my, 0) * 30px)); }
.b2 { width: 300px; height: 300px; background: var(--gold); bottom: 8%; right: -110px; transform: translate(calc(var(--mx, 0) * -40px), calc(var(--my, 0) * -25px)); }
.b3 { width: 260px; height: 260px; background: var(--lilac); top: 42%; left: -120px; transform: translate(calc(var(--mx, 0) * 50px), calc(var(--my, 0) * -35px)); }

main { position: relative; z-index: 1; max-width: 640px; margin: 0 auto; display: grid; gap: 40px; justify-items: center; }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* title */
.top { text-align: center; display: grid; gap: 12px; justify-items: center; }
.chip { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; color: var(--muted); font-weight: 600; }
h1 {
  font-weight: 800; font-size: clamp(42px, 13vw, 84px); line-height: .98; letter-spacing: -.03em; margin: 0; text-wrap: balance;
  cursor: pointer; user-select: none; -webkit-user-select: none;
}
h1 span { display: inline-block; transition: transform .25s cubic-bezier(.3,1.6,.4,1); }
h1 span:hover { transform: translateY(-8px) rotate(-4deg); }
h1 .c0 { color: var(--red); } h1 .c1 { color: var(--green); }
h1.wow { animation: wow .9s cubic-bezier(.3,1.4,.4,1); }
@keyframes wow { 0% { transform: scale(1); } 30% { transform: scale(1.1) rotate(-2deg); } 60% { transform: scale(.97) rotate(1deg); } 100% { transform: scale(1); } }

.titlerow { width: 100%; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px; }
.titlerow h1 { font-size: clamp(32px, 10vw, 76px); text-shadow: var(--title-glow); }
.side { margin: 0; width: clamp(54px, 13vw, 96px); }
.side video { display: block; width: 100%; height: auto; object-fit: cover; border-radius: 12px; background: var(--line); box-shadow: 0 8px 18px var(--shadow); }
.side.l { transform: rotate(-3deg); }
.side.r { transform: rotate(3deg); }
.comic { position: fixed; z-index: 55; pointer-events: none; transform-origin: 50% 60%; animation: comicpop .8s cubic-bezier(.3,1.5,.4,1) forwards; }
@keyframes comicpop {
  0% { transform: scale(.1) rotate(calc(var(--rot) - 25deg)); opacity: 0; }
  18% { transform: scale(1.2) rotate(var(--rot)); opacity: 1; }
  32% { transform: scale(.95) rotate(var(--rot)); }
  75% { transform: scale(1) rotate(var(--rot)); opacity: 1; }
  100% { transform: scale(1.15) rotate(var(--rot)); opacity: 0; }
}
/* scenery: cartoon village — sky, clouds, a stone wall, then a lawn */
.scene { position: absolute; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.sky { position: absolute; left: 0; right: 0; top: 0; height: 722px; background: linear-gradient(to bottom, var(--sky1), var(--sky2)); }
.sky::after {
  content: ""; position: absolute; inset: 0; opacity: var(--stars, 0);
  background-image: radial-gradient(1.5px 1.5px at 12% 18%, #fff, transparent), radial-gradient(1.5px 1.5px at 38% 42%, #fff, transparent), radial-gradient(2px 2px at 64% 12%, #fff, transparent), radial-gradient(1.5px 1.5px at 82% 36%, #fff, transparent), radial-gradient(1.5px 1.5px at 92% 8%, #fff, transparent), radial-gradient(1.5px 1.5px at 24% 62%, #fff, transparent), radial-gradient(2px 2px at 54% 74%, #fff, transparent);
}
.cloud { position: absolute; left: -170px; top: var(--t); width: 110px; height: 34px; border-radius: 34px; background: var(--cloud); animation: drift var(--s, 100s) linear infinite; }
.cloud::before, .cloud::after { content: ""; position: absolute; background: var(--cloud); border-radius: 50%; }
.cloud::before { width: 54px; height: 54px; left: 18px; top: -26px; }
.cloud::after { width: 40px; height: 40px; right: 20px; top: -18px; }
@keyframes drift { from { transform: translateX(0); } to { transform: translateX(calc(100vw + 340px)); } }
.grass {
  position: absolute; left: 0; right: 0; top: 714px; bottom: 0;
  background:
    radial-gradient(circle at 20% 30%, rgba(255,255,255,.9) 2px, transparent 3px) 0 0 / 210px 170px,
    radial-gradient(circle at 70% 65%, #FFE27A 2px, transparent 3px) 0 0 / 260px 200px,
    repeating-conic-gradient(var(--g1) 0 25%, var(--g2) 0 50%) 0 0 / 96px 96px;
}
.wall {
  position: absolute; left: 0; right: 0; top: 676px; height: 46px;
  background: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='56'%20height='46'%20viewBox='0%200%2056%2046'%3E%3Crect%20x='1'%20y='1'%20width='26'%20height='13'%20fill='%23C9C3B6'%20stroke='%238F897D'%20stroke-width='2'/%3E%3Crect%20x='0'%20y='14'%20width='56'%20height='32'%20fill='%23B3AC9F'/%3E%3Cpath%20d='M0%2015H56M0%2030H56M14%2015V30M42%2015V30M28%2030V46M0%2030V46'%20stroke='%238F897D'%20stroke-width='2'%20fill='none'/%3E%3C/svg%3E") repeat-x 0 0 / 56px 46px;
  filter: var(--wall-filter) drop-shadow(0 6px 0 rgba(0,0,0,.18));
}
.flag { position: absolute; top: 596px; width: 40px; height: 80px; filter: var(--wall-filter); }
.deco { position: absolute; filter: var(--wall-filter); }
.troop { position: absolute; bottom: var(--b); left: -60px; width: var(--w, 34px); animation: march var(--dur, 20s) linear var(--dl, 0s) infinite; }
.troop.rtl { left: auto; right: -60px; animation-name: marchback; }
.troop svg { display: block; width: 100%; height: auto; overflow: visible; }
.troop.rtl svg { transform: scaleX(-1); }
.troop .hop { animation: hop .36s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
.troop .legA, .troop .legB { transform-box: fill-box; transform-origin: 50% 0; animation: stride .36s ease-in-out infinite alternate; }
.troop .legB { animation-direction: alternate-reverse; }
.troop .arm { transform-box: fill-box; transform-origin: 0 100%; animation: swing .36s ease-in-out infinite alternate; }
@keyframes march { from { transform: translateX(0); } to { transform: translateX(calc(100vw + 120px)); } }
@keyframes marchback { from { transform: translateX(0); } to { transform: translateX(calc(-100vw - 120px)); } }
@keyframes hop { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@keyframes stride { from { transform: rotate(-28deg); } to { transform: rotate(28deg); } }
@keyframes swing { from { transform: rotate(-18deg); } to { transform: rotate(24deg); } }
.dragon { position: absolute; top: var(--t); left: -90px; width: var(--w, 56px); animation: march var(--dur, 24s) linear var(--dl, 0s) infinite; }
.dragon.rtl { left: auto; right: -90px; animation-name: marchback; }
.dragon .fly { animation: swoop var(--bob, 3.2s) ease-in-out infinite; }
.dragon svg { display: block; width: 100%; height: auto; overflow: visible; }
.dragon.rtl svg { transform: scaleX(-1); }
.dragon .wing { transform-box: fill-box; transform-origin: 80% 100%; animation: flap .34s ease-in-out infinite alternate; }
.dragon .wing.far { animation-delay: -.12s; opacity: .85; }
.dragon .tail { transform-box: fill-box; transform-origin: 100% 50%; animation: wag .7s ease-in-out infinite alternate; }
@keyframes swoop { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-26px) rotate(4deg); } }
@keyframes flap { from { transform: rotate(18deg) scaleY(.9); } to { transform: rotate(-38deg) scaleY(1.05); } }
@keyframes wag { from { transform: rotate(-10deg); } to { transform: rotate(12deg); } }
@media (prefers-reduced-motion: reduce) { .troop, .dragon { display: none; } }
/* front page: tap the gift, an iris wipe reveals the party */
.cover { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; overflow: hidden; text-align: center;
  background: linear-gradient(to bottom, var(--sky1), var(--sky2));
  padding: 24px max(16px, env(safe-area-inset-left, 0px)); }
.cover::before { content: ""; position: absolute; inset: 0; opacity: var(--stars, 0);
  background-image: radial-gradient(1.5px 1.5px at 12% 18%, #fff, transparent), radial-gradient(2px 2px at 64% 12%, #fff, transparent), radial-gradient(1.5px 1.5px at 82% 36%, #fff, transparent), radial-gradient(1.5px 1.5px at 30% 70%, #fff, transparent), radial-gradient(2px 2px at 76% 78%, #fff, transparent); }
.cover-hill { position: absolute; left: -10%; right: -10%; bottom: -30%; height: 55%; border-radius: 50% 50% 0 0; background: var(--g2); box-shadow: inset 0 14px 0 var(--g1); }
.cover-inner { position: relative; z-index: 3; display: grid; justify-items: center; gap: 18px; }
.cover-cta { margin: 0; font-weight: 800; font-size: 15px; letter-spacing: .22em; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.3), 0 0 12px rgba(0,0,0,.25); animation: ctapulse 1.6s ease-in-out infinite; }
@keyframes ctapulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .65; transform: scale(.97); } }
.startgift { position: relative; border: 0; background: none; padding: 0; width: min(190px, 52vw); animation: giftwiggle 2.6s ease-in-out infinite; filter: drop-shadow(0 16px 18px rgba(0,0,0,.25)); }
.startgift::before { content: ""; position: absolute; inset: -18%; border-radius: 50%; border: 4px solid rgba(255,255,255,.7); animation: ringpulse 1.8s ease-out infinite; }
.startgift svg { position: relative; width: 100%; height: auto; display: block; overflow: visible; }
.startgift .lid { transition: transform .5s cubic-bezier(.3,1.5,.4,1); }
.startgift.go { animation: none; }
.startgift.go::before { animation: none; opacity: 0; }
.startgift.go .lid { transform: translateY(-34px) rotate(-18deg); }
.startgift:hover { scale: 1.05; }
.startgift:active { scale: .96; }
@keyframes giftwiggle { 0%, 60%, 100% { transform: rotate(0); } 66% { transform: rotate(-6deg) translateY(-4px); } 72% { transform: rotate(6deg); } 78% { transform: rotate(-4deg); } 84% { transform: rotate(3deg); } }
@keyframes ringpulse { from { transform: scale(.7); opacity: .9; } to { transform: scale(1.25); opacity: 0; } }
.cb { position: absolute; bottom: -90px; left: var(--x); width: 46px; height: 58px; z-index: 1; animation: cbrise var(--d, 10s) linear var(--dl, 0s) infinite; }
.cb::before { content: ""; position: absolute; inset: 0 0 6px; background: var(--c); border-radius: 50% 50% 48% 48% / 58% 58% 42% 42%; box-shadow: inset -6px -6px 0 rgba(0,0,0,.1), inset 5px 5px 0 rgba(255,255,255,.25); }
.cb::after { content: ""; position: absolute; left: 50%; top: 100%; width: 2px; height: 46px; margin-top: -6px; background: rgba(255,255,255,.55); }
@keyframes cbrise { from { transform: translateY(0) translateX(0); } 50% { transform: translateY(-62vh) translateX(14px); } to { transform: translateY(-125vh) translateX(-8px); } }
.iris-ring { position: fixed; z-index: 101; border-radius: 50%; border: 8px solid #FFC24B; box-shadow: 0 0 0 4px #fff, 0 0 24px rgba(255,194,75,.8); pointer-events: none; }
@media (prefers-reduced-motion: reduce) { .cb, .startgift, .cover-cta, .startgift::before { animation: none !important; } }
.tip { margin: 0; font-size: 13px; font-weight: 600; color: var(--ink); }
.blessing {
  margin: 0; min-height: 1.4em; text-align: center; font-weight: 700; font-size: clamp(22px, 6vw, 30px); line-height: 1.2;
  color: #FFC24B; text-shadow: -2px 0 #1B1A3A, 2px 0 #1B1A3A, 0 -2px #1B1A3A, 0 2px #1B1A3A, 0 5px 0 rgba(0,0,0,.25); opacity: 0; transform: translateY(10px) scale(.96);
  transition: opacity .6s ease, transform .6s cubic-bezier(.3,1.4,.4,1);
}
.blessing.show { opacity: 1; transform: none; }
.music {
  position: fixed; z-index: 60; display: flex; align-items: center; gap: 8px;
  right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 999px;
  padding: 9px 14px 9px 12px; font-size: 14px; font-weight: 600; box-shadow: 0 6px 16px var(--shadow);
}
.music svg { width: 18px; height: 18px; display: block; }
.music .wave { opacity: .25; transition: opacity .2s; }
.music[aria-pressed="true"] .wave { opacity: 1; }

/* balloons */
.field { position: relative; width: 100%; height: 340px; }
.pin { position: absolute; top: 0; margin: 0; width: clamp(72px, 14vw, 88px); pointer-events: none; }
.pin video { display: block; width: 100%; height: auto; object-fit: cover; border-radius: 12px; background: var(--line); box-shadow: 0 8px 18px var(--shadow); }
.pin.tl { left: 0; transform: rotate(-4deg); }
.pin.tr { right: 0; transform: rotate(4deg); }
.balloon {
  position: absolute; left: var(--x); bottom: var(--y); width: 66px; height: 82px; border: 0; padding: 0; background: none;
  animation: rise 1.2s cubic-bezier(.2,.8,.3,1) both, bob var(--d, 4s) ease-in-out 1.2s infinite alternate;
}
.balloon .body {
  position: absolute; inset: 0 0 8px 0; background: var(--c); border-radius: 50% 50% 48% 48% / 58% 58% 42% 42%;
  box-shadow: inset -9px -9px 0 rgba(0,0,0,.1), inset 8px 8px 0 rgba(255,255,255,.22);
}
.balloon .body::after { content: ""; position: absolute; left: 50%; bottom: -7px; width: 12px; height: 10px; transform: translateX(-50%); background: var(--c); clip-path: polygon(50% 0, 100% 100%, 0 100%); }
.balloon .string { position: absolute; left: 50%; top: 100%; width: 2px; height: 70px; margin-top: -6px; background: linear-gradient(var(--muted), transparent); opacity: .5; }
.balloon:hover .body { filter: brightness(1.08); }
.balloon.pop { animation: pop .22s ease-out forwards; pointer-events: none; }
@keyframes rise { from { transform: translateY(140%); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes bob { from { transform: translateY(0) rotate(-2deg); } to { transform: translateY(-14px) rotate(2deg); } }
@keyframes pop { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.35); opacity: .8; } 100% { transform: scale(1.6); opacity: 0; } }

/* cake */
.cake {
  width: 100%; display: grid; gap: 20px 16px; align-items: center;
  grid-template-columns: minmax(0, 1fr) minmax(0, 320px) minmax(0, 1fr);
  grid-template-areas: "left core right";
}
.cake-core { grid-area: core; display: grid; gap: 20px; justify-items: center; min-width: 0; }
.clip { margin: 0; min-width: 0; }
.clip.left { grid-area: left; justify-self: end; transform: rotate(-3deg); }
.clip.right { grid-area: right; justify-self: start; transform: rotate(3deg); }
.clip video {
  display: block; width: min(132px, 100%); height: auto; max-height: 240px; object-fit: cover;
  border-radius: 14px; background: var(--line); box-shadow: 0 10px 22px var(--shadow);
  transition: transform .25s cubic-bezier(.3,1.5,.4,1);
}
.clip video:hover { transform: scale(1.06) rotate(-2deg); }
@media (max-width: 560px) {
  .cake { grid-template-columns: 1fr 1fr; grid-template-areas: "core core" "left right"; }
  .clip.left { justify-self: start; }
  .clip.right { justify-self: end; }
  .clip video { width: min(150px, 42vw); }
}
.cake-svg { width: min(320px, 84vw); height: auto; display: block; overflow: visible; }
.candle { cursor: pointer; }
.flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flicker 1.1s ease-in-out infinite alternate; transition: opacity .25s, scale .25s; }
.candle:nth-child(2) .flame { animation-delay: -.4s; } .candle:nth-child(3) .flame { animation-delay: -.7s; }
@keyframes flicker { from { transform: scale(1, 1) rotate(-3deg); } to { transform: scale(.9, 1.1) rotate(3deg); } }
.candle.out .flame { opacity: 0; scale: .2; animation: none; }
.glow { transition: opacity .3s; }
.candle.out .glow { opacity: 0; }
.smoke { opacity: 0; transform-box: fill-box; transform-origin: 50% 100%; }
.candle.puff .smoke { animation: smoke 1.6s ease-out forwards; }
@keyframes smoke { 0% { opacity: .7; transform: translateY(0) scaleY(.6); } 100% { opacity: 0; transform: translateY(-26px) scaleY(1.3); } }
.btn {
  border: 0; border-radius: 999px; background: var(--coral); color: var(--on-accent);
  font-weight: 700; font-size: 16px; padding: 12px 24px;
  box-shadow: 0 5px 0 rgba(0,0,0,.16); transition: transform .12s, box-shadow .12s;
}
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.16); }
.btn.ghost { background: var(--paper); border: 2px solid var(--line); box-shadow: none; color: var(--ink); }

/* gifts */
.gifts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; width: 100%; max-width: 420px; }
.gift { border: 0; background: none; padding: 6px; width: 100%; transition: transform .2s; }
.gift:hover { transform: translateY(-4px) rotate(-2deg); }
.gift svg { width: 100%; height: auto; display: block; overflow: visible; }
.lid { transition: transform .5s cubic-bezier(.3,1.4,.4,1); transform-box: fill-box; transform-origin: 0% 100%; }
.giftwrap { width: 100%; display: grid; justify-items: center; gap: 14px; padding-top: 88px; margin-top: -32px; }
.slot { position: relative; min-width: 0; }
.prize-out {
  position: absolute; left: 50%; top: 40px; z-index: 3; pointer-events: none; opacity: 0;
  transform: translate(-50%, -30%) scale(.2) rotate(-20deg); transform-origin: 50% 100%;
  transition: transform .7s cubic-bezier(.3,1.6,.4,1), opacity .25s;
}
.gift[aria-expanded="true"] + .prize-out { opacity: 1; transform: translate(-50%, -100%) scale(1) rotate(0deg); }
.prize-out svg, .prize-out img { display: block; width: 100%; height: auto; }
.prize-out.p1 { width: 96px; }
.prize-out.p2 { width: 64px; }
.prize-out.p3 { width: 76px; }
.prize-out.p3 img { border: 5px solid #fff; border-bottom-width: 14px; border-radius: 3px; box-shadow: 0 8px 18px var(--shadow); transform: rotate(4deg); }
.prize-out .bolt { animation: zap .45s steps(2) infinite alternate; }
@keyframes zap { from { filter: brightness(1); } to { filter: brightness(1.3); } }
.rat {
  position: absolute; left: calc(100% + 4px); top: 18%; z-index: 4; width: clamp(64px, 18vw, 92px); height: auto; pointer-events: none;
  border-radius: 12px; border: 3px solid #fff; box-shadow: 0 8px 18px var(--shadow);
  opacity: 0; transform: translateX(-8px) scale(.85) rotate(-6deg);

  /* comic-book burst: a halftone starburst with POW! style text */
  var comicWords = ['POW!', 'BOOM!', 'POP!', 'BANG!', 'ZAP!'];

      '<defs><pattern id="ht" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="4.5" cy="4.5" r="1.9" style="fill:var(--red)"/></pattern></defs>' +
      '<polygon points="' + pts + '" transform="translate(6 6)" fill="#1B1A3A"/>' +

      '<text x="100" y="' + (long ? 114 : 118) + '" text-anchor="middle" font-family="Bricolage Grotesque, Avenir Next, Segoe UI, sans-serif" font-weight="800" font-style="italic" font-size="' + (long ? 36 : 46) + '" fill="#fff" stroke="#1B1A3A" stroke-width="7" stroke-linejoin="round" style="paint-order:stroke" transform="rotate(-8 100 100)">' + w + '</text>' +
      '</svg>';

    setTimeout(function () { el.remove(); }, 800);
  }

  /* fireworks: two rings of sparks */
  function ring(x, y, count, speed, color) {
    if (reduce) count = Math.min(count, 10);
    var gold = palette()[1];
    for (var i = 0; i < count; i++) {

      sparks.push({ x: x, y: y, px: x, py: y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, t: 0, max: 55 + Math.random() * 25, c: i % 5 === 0 ? gold : color });
    }

  }
  function firework(x, y, color) {
    var cols = palette();

    setTimeout(function () { ring(x, y, 28, 3, cols[(Math.random() * cols.length) | 0]); }, reduce ? 0 : 150);
  }

  /* audio: one shared context, started by a tap */
  var ac = null;

    } catch (e) {}
  }

  /* background music: the Happy Birthday melody as a soft music box over gentle chords, looping, made in the browser */
  var music = { on: false, userOff: false, timer: 0, step: 0, next: 0, master: null, pad: null, pluck: null, noise: null };
  var BEAT = 60 / 80, LOOP = 27;
  var melody = [
    [67, .75], [67, .25], [69, 1], [67, 1], [72, 1], [71, 2],
    [67, .75], [67, .25], [69, 1], [67, 1], [74, 1], [72, 2],
    [67, .75], [67, .25], [79, 1], [76, 1], [72, 1], [71, 1], [69, 1],
    [77, .75], [77, .25], [76, 1], [72, 1], [74, 1], [72, 2]
  ];
  var voicing = { C: { pad: [48, 52, 55], bass: 36 }, G: { pad: [47, 50, 55], bass: 31 }, F: { pad: [45, 48, 53], bass: 29 } };
  var song = [];
  (function () {
    var t = 0;
    melody.forEach(function (n) { song.push({ t: t, m: n[0], d: n[1] }); t += n[1]; });

    if (e.target && e.target.closest && e.target.closest('#music')) return;

  }
  document.addEventListener('click', firstTap, true);
  document.addEventListener('keydown', firstTap, true);
  $('#music').addEventListener('click', function (e) {
    e.stopPropagation();

    if (!ac) return;

  });

  /* title click */
  title.addEventListener('click', function (e) {
    e.stopPropagation();
    burst(e.clientX, e.clientY, 40, 1.2);
    title.classList.remove('wow'); void title.offsetWidth; title.classList.add('wow');
  });

  /* balloons: tap to pop, a new one floats up */
  var field = $('#field');
  var spots = [
    { x: '3%', y: '30px', d: '4.2s' }, { x: '19%', y: '120px', d: '3.6s' }, { x: '35%', y: '10px', d: '4.8s' },
    { x: '52%', y: '110px', d: '3.9s' }, { x: '68%', y: '25px', d: '4.4s' }, { x: '84%', y: '105px', d: '3.7s' }

    b.style.setProperty('--x', s.x); b.style.setProperty('--y', s.y); b.style.setProperty('--d', s.d); b.style.setProperty('--c', c);
    b.style.animationDelay = fresh ? '0s, 1.2s' : (i * .12) + 's, ' + (1.2 + i * .12) + 's';
    b.innerHTML = '<span class="body"></span><span class="string"></span>';
    b.addEventListener('click', function (e) {
      e.stopPropagation();

      var cc = c.indexOf('var(') === 0 ? getComputedStyle(root).getPropertyValue(c.slice(4, -1)).trim() : c;
      firework(r.left + r.width / 2, r.top + r.height * .4, cc);
      comic(r.left + r.width / 2, r.top + r.height * .4);

  }
  spots.forEach(function (_, i) { field.appendChild(makeBalloon(i, false)); });

  /* cake */
  var candles = $$('.candle'), blow = $('#blow');
  function refresh() {
    var all = candles.every(function (c) { return c.classList.contains('out'); });
    blow.textContent = all ? 'Light them again' : 'Blow out the candles';
    blow.classList.toggle('ghost', all);
    var bl = $('#blessing');
    bl.textContent = all ? '“MAY THY WISH COME TRUE”' : '';
    bl.classList.toggle('show', all);
    if (all) {
      var r = $('.cake-svg').getBoundingClientRect();
      burst(r.left + r.width / 2, r.top + r.height * .35, 70, 1.4);
      setTimeout(function () { burst(r.left + r.width * .25, r.top + r.height * .4, 30, 1); burst(r.left + r.width * .75, r.top + r.height * .4, 30, 1); }, 280);

  }

  }
  candles.forEach(function (c) {
    function toggle(e) {
      e.stopPropagation();

    c.addEventListener('click', toggle);
    c.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(e); } });
  });

    e.stopPropagation();
    if (candles.every(function (c) { return c.classList.contains('out'); })) {
      candles.forEach(function (c) { c.classList.remove('out', 'puff'); }); refresh(); return;
    }
    candles.forEach(function (c, i) { setTimeout(function () { snuff(c); if (i === candles.length - 1) refresh(); }, reduce ? 0 : i * 220); });
  });

  $$('.gift').forEach(function (g) {

  /* finale: once all three gifts are open, the birthday message and photo fade in */

    var fin = $('#finale'); if (!fin) return;

    clearTimeout(finaleTimer);

      fin.hidden = false;

        fin.classList.add('show');

      }, reduce ? 0 : 900);

      fin.classList.remove('show');
      finaleTimer = setTimeout(function () { fin.hidden = true; }, 1400);
    }
  }

  /* funny rat: fades in beside gift three, stays about 4 seconds, fades out */

    rat.classList.toggle('flip', slot.right + 96 > innerWidth - 8);
    void rat.offsetWidth;
    rat.classList.add('show');

  }

  /* front page: tap the gift, then an iris wipe from the gift reveals the party */
  (function () {
    var cover = $('#cover'), start = $('#start'), cbs = $('#cbs'); if (!cover || !start) return;
    var de = document.documentElement, done = false;
    de.style.overflow = 'hidden'; document.body.style.overflow = 'hidden';
    var cols = ['var(--coral)', 'var(--gold)', 'var(--teal)', 'var(--lilac)'];
    for (var i = 0; i < 8; i++) {
      var b = document.createElement('span');
      b.className = 'cb'; b.style.setProperty('--x', (4 + i * 12.5) + '%'); b.style.setProperty('--c', cols[i % 4]);
      b.style.setProperty('--d', (9 + (i * 7) % 5) + 's'); b.style.setProperty('--dl', (-i * 1.3) + 's');
      cbs.appendChild(b);
    }

      cover.hidden = true;
      de.style.overflow = ''; document.body.style.overflow = '';
      window.scrollTo(0, 0);
      burst(innerWidth / 2, innerHeight * .3, 60, 1.4);
      title.classList.remove('wow'); void title.offsetWidth; title.classList.add('wow');
    }
    start.addEventListener('click', function () {
      if (done) return; done = true;
      start.classList.add('go');
      var r = start.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
      burst(x, y, 60, 1.5);
      if (reduce) { cover.style.transition = 'opacity .4s'; cover.style.opacity = 0; setTimeout(finish, 420); return; }
      var maxR = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y)) + 20;
      var ring = document.createElement('div'); ring.className = 'iris-ring'; document.body.appendChild(ring);

  document.addEventListener('click', function (e) {

})();
